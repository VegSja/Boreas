name: "dbt_boreas"
version: "1.0.0"
config-version: 2

profile: "dbt_boreas"

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_boreas:
    1_bronze:
      +materialized: table
      +schema: 1_bronze
    2_silver:
      +materialized: table
      +schema: 2_silver
    3_gold:
      +materialized: table
      +schema: 3_gold
  elementary:
    +schema: elementary
    +materialized: table

# All elementary-generated tests emit warnings (not errors) so they surface
# as WARN asset checks in Dagster without failing the pipeline.
tests:
  elementary:
    +severity: warn

vars:
  days_back: 365
  anomaly_sensitivity: 3
  anomaly_seasonality: day_of_week
  training_period:
    period: day
    count: 90
  detection_period:
    period: day
    count: 7
  elementary:
    disable_dbt_invocation_autoupload: true
    disable_dbt_artifacts_autoupload: true
    disable_run_results: false
